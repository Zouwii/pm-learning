<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Diagnosis-Agent 简化诊断过程页交互原型。" />
    <title>诊断过程｜Diagnosis-Agent 原型</title>
    <link rel="stylesheet" href="../create-case/styles.css?v=20260831-2" />
    <link rel="stylesheet" href="./styles.css?v=20260831-2" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="../create-case/" aria-label="返回创建 Case">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Z" />
              <path d="M8 9h8M8 13h5M8 17h3" />
            </svg>
          </span>
          <span><strong>Diagnosis-Agent</strong><small>现场问题辅助诊断</small></span>
        </a>

        <nav class="topnav" aria-label="主导航">
          <a href="../create-case/">创建 Case</a>
          <a class="active" href="#">我的 Case</a>
        </nav>

      </header>

      <main class="progress-main">
        <a class="back-link" href="../create-case/">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
          返回 Case 列表
        </a>

        <section class="case-summary">
          <div class="case-title-area">
            <div class="case-meta">
              <span>CASE-482731</span>
              <span class="status-pill completed" id="caseStatus">诊断完成</span>
            </div>
            <h1>小车执行搬运任务时定位丢失，任务中断</h1>
            <p>内网车辆 172.19.3.79 · 发生时间 2026-08-25 14:30</p>
          </div>

          <label class="prototype-state">
            <span>诊断状态</span>
            <select id="stateSelect">
              <option value="completed">诊断完成</option>
              <option value="running">诊断执行中</option>
              <option value="missing">材料不足</option>
              <option value="failed">执行失败</option>
            </select>
          </label>
        </section>

        <section class="content-grid">
          <aside class="steps-card">
            <div class="card-heading">
              <div><p>DIAGNOSIS FLOW</p><h2>诊断步骤</h2></div>
              <span id="stepCount">5 / 5</span>
            </div>
            <ol class="steps-list" id="stepsList"></ol>
          </aside>

          <section class="result-card" aria-live="polite">
            <div class="result-heading">
              <div>
                <p>DIAGNOSIS RESULT</p>
                <h2 id="resultTitle">排查结果</h2>
              </div>
              <span class="result-count" id="resultCount">已完成 4 项检查</span>
            </div>

            <div class="table-wrap">
              <table class="check-table">
                <thead>
                  <tr>
                    <th>结果</th>
                    <th>排查项</th>
                    <th>排查内容与结论</th>
                    <th>证据</th>
                    <th>状态</th>
                  </tr>
                </thead>
                <tbody id="resultRows"></tbody>
              </table>
            </div>

            <section class="execution-section">
              <div class="execution-heading">
                <div><h3>执行记录</h3></div>
                <button class="text-button" id="toggleTimelineButton" type="button">收起</button>
              </div>
              <div class="timeline" id="timeline"></div>
            </section>

            <div class="result-actions" id="resultActions"></div>
          </section>
        </section>
      </main>

      <div class="drawer-mask hidden" id="drawerMask"></div>
      <aside class="evidence-drawer hidden" id="evidenceDrawer" aria-label="原始证据">
        <div class="drawer-heading">
          <div><p>RAW EVIDENCE</p><h2>原始证据</h2></div>
          <button type="button" id="closeDrawerButton" aria-label="关闭">×</button>
        </div>
        <dl>
          <div><dt>来源</dt><dd id="drawerSource"></dd></div>
          <div><dt>时间</dt><dd id="drawerTime"></dd></div>
        </dl>
        <pre id="drawerContent"></pre>
      </aside>

      <div class="toast hidden" id="toast" role="status"></div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
